name: Staff browser workflow

on:
  push:
    branches: [codex/service-work-demo]
    paths:
      - .github/workflows/staff-browser.yml
      - garageos/admin-dashboard/**
      - garageos/backend/**
  pull_request:
    paths:
      - .github/workflows/staff-browser.yml
      - garageos/admin-dashboard/**
      - garageos/backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/garage_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: browser-test-only-secret-not-for-production
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010/api/v1
      BASE_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: garageos/backend
      - name: Prepare migrated demo database
        working-directory: garageos/backend
        run: |
          alembic upgrade head
          python -m app.seeds.demo --fresh
      - run: npm ci
        working-directory: garageos
      - run: npx playwright install --with-deps chromium
        working-directory: garageos/admin-dashboard
      - run: npm run build
        working-directory: garageos/admin-dashboard
      - name: Verify account management and service assignment in real browsers
        working-directory: garageos/admin-dashboard
        run: |
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8010) > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          npm run start -- --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/health > /dev/null && curl --fail --silent http://127.0.0.1:3001/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/health > /dev/null
          curl --fail --silent http://127.0.0.1:3001/healthz > /dev/null
          npx playwright test e2e/staff-accounts.spec.ts e2e/service-work-invoice.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-browser-evidence
          path: garageos/admin-dashboard/test-results
          retention-days: 7
