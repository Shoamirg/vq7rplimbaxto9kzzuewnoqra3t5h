name: Staff browser workflow

on:
  # Retained as a manual hosted-runner fallback; Jenkins runs the browser gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/garage_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: browser-test-only-secret-not-for-production
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8010/api/v1
      BASE_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - name: Install isolated backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip check
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        working-directory: garageos/backend
      - name: Prepare migrated demo database
        working-directory: garageos/backend
        run: |
          alembic upgrade head
          python -m app.seeds.demo --fresh
          python -m tests.support.platform_browser
      - run: npm ci
        working-directory: garageos
      - run: npx playwright install --with-deps chromium
        working-directory: garageos/admin-dashboard
      - run: npm run build
        working-directory: garageos/admin-dashboard
      - name: Verify the complete production browser release suite
        working-directory: garageos/admin-dashboard
        run: |
          export DEBUG=false
          export GARAGEOS_BROWSER_PYTHON="$PWD/../backend/.venv/bin/python"
          export TELEGRAM_BOT_TOKEN="$(python -c 'import secrets; print("GARAGEOS_QA_BROWSER_" + secrets.token_urlsafe(32))')"
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          export GARAGEOS_BROWSER_FIXTURE="$RUNNER_TEMP/browser-fixture.json"
          trap 'rm -f -- "$GARAGEOS_BROWSER_FIXTURE"; unset TELEGRAM_BOT_TOKEN' EXIT
          (cd ../backend && python -m tests.support.browser_release --output "$GARAGEOS_BROWSER_FIXTURE")
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8010) > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          node ../node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; rm -f -- "$GARAGEOS_BROWSER_FIXTURE"; unset TELEGRAM_BOT_TOKEN' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/health > /dev/null && curl --fail --silent http://127.0.0.1:3001/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/health > /dev/null
          curl --fail --silent http://127.0.0.1:3001/healthz > /dev/null
          npx playwright test --retries=0 --trace=off --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-browser-evidence
          path: garageos/admin-dashboard/test-results
          retention-days: 7
