name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/garage_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed demo data
        # Integration tests log in as the seeded demo admin and assert against real
        # tenant data; seed before pytest so those (and the audit/auth tests) pass.
        run: python -m app.seeds.demo --fresh
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend · typecheck · i18n · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: garageos/admin-dashboard
      - name: i18n coverage
        run: npm run i18n:check
        working-directory: garageos/admin-dashboard
      - name: Lint
        run: npm run lint
        working-directory: garageos/admin-dashboard
      - name: Build
        run: npm run build
        working-directory: garageos/admin-dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # E2E is added in Week 2 once the Playwright journey suite lands; it will spin
  # up the prod compose and walk the staff + customer flows in EN + RU.
  # e2e:
  #   needs: [backend, frontend]
  #   runs-on: ubuntu-latest
  #   steps: ...
