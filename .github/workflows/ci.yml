name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/garage_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify migrated schema matches model metadata
        run: alembic check
      - name: Verify service work on migrated schema before seeding
        run: python -m pytest tests/test_service_work_api.py -q
      - name: Seed demo data
        # Integration tests log in as the seeded demo admin and assert against real
        # tenant data; seed before pytest so those (and the audit/auth tests) pass.
        run: python -m app.seeds.demo --fresh
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend · typecheck · i18n · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: garageos/admin-dashboard
      - name: i18n coverage
        run: npm run i18n:check
        working-directory: garageos/admin-dashboard
      - name: i18n audit (no new hardcoded strings)
        run: npm run i18n:audit
        working-directory: garageos/admin-dashboard
      - name: Lint
        run: npm run lint
        working-directory: garageos/admin-dashboard
      - name: Build
        run: npm run build
        working-directory: garageos/admin-dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  flutter:
    name: Flutter · analyze · workflow · live API · web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos/flutter_app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/garage_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Verify complete Uzbek, English and Russian catalogs
        run: |
          dart run tool/check_l10n.dart
          flutter gen-l10n
      - run: flutter analyze
      - name: Prepare isolated API database
        working-directory: garageos/backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python ../flutter_app/tool/seed_api_smoke.py "$RUNNER_TEMP/flutter-smoke.json"
      - name: Unit, responsive workflow and real API tests
        run: |
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8010) > "$RUNNER_TEMP/flutter-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health > /dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat "$RUNNER_TEMP/flutter-api.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/health > /dev/null
          flutter test --dart-define=RUN_LIVE_API=true --dart-define=API_URL=http://127.0.0.1:8010/api/v1 --dart-define="SMOKE_FIXTURE=$RUNNER_TEMP/flutter-smoke.json"
      - name: Build web with bundled renderer
        run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: garageos-flutter-web
          path: garageos/flutter_app/build/web
          retention-days: 7

  # E2E is added in Week 2 once the Playwright journey suite lands; it will spin
  # up the prod compose and walk the staff + customer flows in EN + RU.
  # e2e:
  #   needs: [backend, frontend]
  #   runs-on: ubuntu-latest
  #   steps: ...
