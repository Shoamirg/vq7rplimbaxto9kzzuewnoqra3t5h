name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/garage_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - name: Verify local Compose ports bind only to loopback
        working-directory: garageos
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          : > .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/garageos-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(os.environ["RUNNER_TEMP"]) / "garageos-compose.json"
          services = json.loads(config_path.read_text())["services"]
          expected = {
              "postgres": ("5432", "5432"),
              "redis": ("6379", "6379"),
              "backend": ("8000", "8000"),
              "admin-dashboard": ("3000", "3000"),
              "nginx": ("80", "80"),
          }
          for name, (published, target) in expected.items():
              ports = services[name]["ports"]
              assert len(ports) == 1, f"{name} must have exactly one local published port"
              binding = ports[0]
              assert binding["host_ip"] == "127.0.0.1", f"{name} must bind to loopback"
              assert str(binding["published"]) == published, f"unexpected host port for {name}"
              assert str(binding["target"]) == target, f"unexpected container port for {name}"
              print(f"{name}: loopback-only on 127.0.0.1:{published}")
          PY
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed demo data
        # Integration tests log in as the seeded demo admin and assert against real
        # tenant data; seed before pytest so those (and the audit/auth tests) pass.
        run: python -m app.seeds.demo --fresh
      - name: Pytest
        run: python -m pytest -q

  backend-dependency-audit:
    name: Backend · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit --requirement garageos/backend/requirements.txt

  frontend:
    name: Frontend · typecheck · i18n · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garageos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: garageos/admin-dashboard
      - name: i18n coverage
        run: npm run i18n:check
        working-directory: garageos/admin-dashboard
      - name: i18n audit (no new hardcoded strings)
        run: npm run i18n:audit
        working-directory: garageos/admin-dashboard
      - name: Lint
        run: npm run lint
        working-directory: garageos/admin-dashboard
      - name: Build
        run: npm run build
        working-directory: garageos/admin-dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Browser · Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: garageos
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garage_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/garage_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-e2e-secret-key-not-for-production
      ENVIRONMENT: development
      DEBUG: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garageos/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: garageos/package-lock.json
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: |
          npm install --global --ignore-scripts npm@11.21.0
          test "$(npm --version)" = "11.21.0"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: garageos/backend
      - name: Apply migrations
        run: alembic upgrade head
        working-directory: garageos/backend
      - name: Seed isolated demo database
        run: python -m app.seeds.demo --fresh
        working-directory: garageos/backend
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: garageos/admin-dashboard
      - name: Start services and run browser tests
        shell: bash
        run: |
          set -euo pipefail

          pushd ../backend > /dev/null
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/garageos-api.log 2>&1 &
          api_pid=$!
          popd > /dev/null
          npm run dev -- --hostname 0.0.0.0 > /tmp/garageos-web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          api_ready=false
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              api_ready=true
              break
            fi
            sleep 1
          done
          if [ "$api_ready" != true ]; then
            cat /tmp/garageos-api.log
            exit 1
          fi

          web_ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://localhost:3000/healthz > /dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done
          if [ "$web_ready" != true ]; then
            cat /tmp/garageos-web.log
            exit 1
          fi

          npm run e2e
        working-directory: garageos/admin-dashboard
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            garageos/admin-dashboard/playwright-report/
            garageos/admin-dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
