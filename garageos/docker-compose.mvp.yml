name: garageos-mvp-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garageos_local
      POSTGRES_PASSWORD: garageos_local_only
      POSTGRES_DB: garageos_mvp_local
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U garageos_local -d garageos_mvp_local]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 128m
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.mvp
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://garageos_local:garageos_local_only@postgres:5432/garageos_mvp_local
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: garageos-local-isolated-synthetic-data-only-2026
      SMS_PROVIDER: console
      CUSTOMER_SELF_ENROLLMENT: "true"
      LOCAL_TEST_MODE: "true"
      PUSH_PROVIDER: disabled
      UPLOAD_DIR: /data/uploads
      DEMO_MODE_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"
      TELEGRAM_BOT_TOKEN: ""
      SENTRY_DSN: ""
      RATE_LIMIT_AUTH_MAX: "120"
      VERIFICATION_SEND_MAX: "30"
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - ./backend:/app:ro
    command: [sh, -c, "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 768m

volumes:
  postgres:
  uploads:
