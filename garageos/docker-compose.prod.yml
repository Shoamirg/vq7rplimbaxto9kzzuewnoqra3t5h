# GarageOS — production stack. One command to run the whole platform on a host:
#
#   cp .env.prod.example .env.prod   # then fill in real secrets + DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Optional Telegram bot: add --profile telegram; requires its real token.
#
# Exposes only ports 80/443 (Caddy). Everything else is internal.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file: ["${GARAGEOS_ENV_FILE:-.env.prod}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  telegram-bot:
    profiles: [telegram]
    build:
      context: ./telegram-bot
      dockerfile: ../docker/Dockerfile.bot
    restart: unless-stopped
    env_file: ["${GARAGEOS_ENV_FILE:-.env.prod}"]
    depends_on:
      backend: { condition: service_started }
    command: ["python", "bot.py"]

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard.prod
    restart: unless-stopped
    environment:
      # Server-side BFF target — internal backend, never public.
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      NODE_ENV: production
      GARAGEOS_TRUST_CADDY_IP: "true"
    depends_on:
      backend: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
